async function start(){mus('town');mode='talk';await run(['¡Buenos días, Paulette!','Hoy comienza tu aventura Pokémon en Villa Malta.','Habla con el Prof. Alejandro. Está frente a su laboratorio.'])}

async function toss(e,p){await say('¡Paulette lanzó una POKÉ BALL!',700);sfx.throw();await anim(800,t=>bs.ball={x:56+130*t,y:70-Math.sin(t*Math.PI)*46-8*t,r:t*12});

await sleep(400);if(ok)return 1;bs.ball=null;e.hide=false;sfx.pop();await say(['¡Oh, no! ¡El Pokémon se escapó!','¡Casi lo atrapas!','¡Aaah! ¡Estuvo muy cerca!'][n],1000);return 0}

async function wildFight(){F.cd=4;const first=!F.won,e={n:first||Math.random()<.5?'ANTOTTAT':'ISATTAT',lv:3+rnd(3),hp:16,max:16,dh:16,img:'ra',pb:.4},o={n:'WESLEY',lv:12,hp:50,max:50,dh:50};

while(1){const c=await choose(['LUCHAR','POKÉ BALL x'+balls,'HUIR'],'¿Qué hará WESLEY?');

if(c==1){if(balls<=0){await say('¡No te quedan POKÉ BALLS! Pide más al Prof. Alejandro.',1200);continue}
balls--;if(await toss(e,Math.min(.95,e.pb+(1-e.hp/e.max)*.55))){F.won=1;await gotIt(e);await endBattle();if(first)await run(['¡Qué combate! El camino al norte te espera.']);return}await foe();continue}
const m=await choose(['PLACAJE','CUERPO PESADO'],'Elige un ataque');await say('¡WESLEY usó '+(m?'CUERPO PESADO':'PLACAJE')+'!',700);
await anim(400,t=>bs.lx=Math.sin(t*3.14)*30);bs.lx=0;sfx.hit();for(let i=0;i<4;i++){e.hide=i%2==0;await sleep(80)}e.hide=false;e.hp=Math.max(0,e.hp-(m?11+rnd(4):6+rnd(3)));await sleep(500);
if(e.hp<=0){sfx.faint();await anim(500,t=>e.off=t*40);e.hide=true;mus(null);jingle(WIN,140);await say('¡'+e.n+' salvaje se debilitó!',1000);await say('¡WESLEY ganó 120 puntos de experiencia!',1200);balls++;await say('¡Paulette encontró una POKÉ BALL!',1000);F.won=1;await endBattle();if(first)await run(['¡Qué combate! El camino al norte te espera.']);return}
await foe()}}
